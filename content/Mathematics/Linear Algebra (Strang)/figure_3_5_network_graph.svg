<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="edge-arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="edge-arrow-diag" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
    <marker id="loop-arrow-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="loop-arrow-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <!-- Loop Region Gradients -->
    <linearGradient id="grad-loop1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="grad-loop2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.30" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="510" y="40" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Network Graph and Incidence Matrix</text>
  <text x="510" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">4 Nodes, 5 Directed Edges, and Independent Current Loops (N(Aᵀ))</text>

  <!-- ==================== LEFT AREA: THE NETWORK GRAPH ==================== -->
  <g transform="translate(40, 90)">
    <!-- Container boundary -->
    <rect x="0" y="0" width="560" height="490" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2" />
    
    <!-- Shaded Faces for Loops -->
    <!-- Loop 1 (Upper Triangle: x1 -> x2 -> x3) -->
    <polygon points="90,245 280,105 470,245" fill="url(#grad-loop1)" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Loop 2 (Lower Triangle: x1 -> x3 -> x4) -->
    <polygon points="90,245 470,245 280,385" fill="url(#grad-loop2)" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Loop 1 Center Indicator -->
    <g transform="translate(280, 195)">
      <!-- Clockwise loop arrow -->
      <path d="M 0 -22 A 22 22 0 1 1 -18 12" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#loop-arrow-1)" />
      <rect x="-65" y="-12" width="130" height="25" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Loop 1: b₁ − b₂ + b₃ = 0</text>
    </g>

    <!-- Loop 2 Center Indicator -->
    <g transform="translate(280, 295)">
      <!-- Clockwise loop arrow -->
      <path d="M 0 -22 A 22 22 0 1 1 -18 12" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#loop-arrow-2)" />
      <rect x="-65" y="-12" width="130" height="25" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Loop 2: b₂ + b₄ + b₅ = 0</text>
    </g>

    <!-- Directed Edges -->
    <!-- Edge b1: x1 -> x2 -->
    <line x1="90" y1="245" x2="280" y2="105" stroke="#38bdf8" stroke-width="3" marker-end="url(#edge-arrow)" />
    <!-- Edge b2: x1 -> x3 (Horizontal Diagonal) -->
    <line x1="90" y1="245" x2="470" y2="245" stroke="#818cf8" stroke-width="3" marker-end="url(#edge-arrow-diag)" />
    <!-- Edge b3: x2 -> x3 -->
    <line x1="280" y1="105" x2="470" y2="245" stroke="#38bdf8" stroke-width="3" marker-end="url(#edge-arrow)" />
    <!-- Edge b4: x3 -> x4 -->
    <line x1="470" y1="245" x2="280" y2="385" stroke="#38bdf8" stroke-width="3" marker-end="url(#edge-arrow)" />
    <!-- Edge b5: x4 -> x1 -->
    <line x1="280" y1="385" x2="90" y2="245" stroke="#38bdf8" stroke-width="3" marker-end="url(#edge-arrow)" />

    <!-- Edge Badges (Pills) -->
    <!-- b1 -->
    <rect x="160" y="155" width="36" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="178" y="171" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">b₁</text>

    <!-- b2 -->
    <rect x="262" y="234" width="36" height="22" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="280" y="250" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">b₂</text>

    <!-- b3 -->
    <rect x="365" y="155" width="36" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="383" y="171" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">b₃</text>

    <!-- b4 -->
    <rect x="365" y="315" width="36" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="383" y="331" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">b₄</text>

    <!-- b5 -->
    <rect x="160" y="315" width="36" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="178" y="331" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">b₅</text>

    <!-- Nodes (Circles with labels) -->
    <!-- Node x1 -->
    <circle cx="90" cy="245" r="22" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5" />
    <text x="90" y="251" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">x₁</text>

    <!-- Node x2 -->
    <circle cx="280" cy="105" r="22" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5" />
    <text x="280" y="111" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">x₂</text>

    <!-- Node x3 -->
    <circle cx="470" cy="245" r="22" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5" />
    <text x="470" y="251" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">x₃</text>

    <!-- Node x4 -->
    <circle cx="280" cy="385" r="22" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5" />
    <text x="280" y="391" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">x₄</text>

    <!-- Graph Info Footer -->
    <text x="280" y="455" text-anchor="middle" fill="#94a3b8" font-size="13">
      Spanning Tree (Rank r = 3): any 3 edges without loops (e.g., {b₁, b₂, b₄})
    </text>
  </g>

  <!-- ==================== RIGHT AREA: MATRICES & FORMULAS ==================== -->
  <g transform="translate(620, 90)">
    <!-- Incidence Matrix Card -->
    <rect x="0" y="0" width="360" height="260" rx="14" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2" />
    <text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="700">Incidence Matrix A (5 × 4)</text>
    <text x="20" y="48" fill="#64748b" font-size="11">Rows = Directed Edges, Columns = Nodes</text>

    <!-- Column labels -->
    <text x="110" y="72" fill="#94a3b8" font-size="12" font-weight="600">x₁</text>
    <text x="145" y="72" fill="#94a3b8" font-size="12" font-weight="600">x₂</text>
    <text x="180" y="72" fill="#94a3b8" font-size="12" font-weight="600">x₃</text>
    <text x="215" y="72" fill="#94a3b8" font-size="12" font-weight="600">x₄</text>

    <!-- Matrix brackets -->
    <path d="M 90 82 L 80 82 L 80 230 L 90 230" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <path d="M 235 82 L 245 82 L 245 230 L 235 230" fill="none" stroke="#e2e8f0" stroke-width="2" />

    <!-- Matrix Rows & Row labels -->
    <!-- row 1 (b1) -->
    <text x="50" y="103" fill="#38bdf8" font-size="12" font-weight="600">b₁ :</text>
    <text x="110" y="103" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">−1</text>
    <text x="145" y="103" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">+1</text>
    <text x="180" y="103" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="215" y="103" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="260" y="103" fill="#cbd5e1" font-size="11">(x₁ → x₂)</text>

    <!-- row 2 (b2) -->
    <text x="50" y="133" fill="#818cf8" font-size="12" font-weight="600">b₂ :</text>
    <text x="110" y="133" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">−1</text>
    <text x="145" y="133" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="180" y="133" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">+1</text>
    <text x="215" y="133" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="260" y="133" fill="#cbd5e1" font-size="11">(x₁ → x₃)</text>

    <!-- row 3 (b3) -->
    <text x="50" y="163" fill="#38bdf8" font-size="12" font-weight="600">b₃ :</text>
    <text x="110" y="163" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="145" y="163" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">−1</text>
    <text x="180" y="163" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">+1</text>
    <text x="215" y="163" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="260" y="163" fill="#cbd5e1" font-size="11">(x₂ → x₃)</text>

    <!-- row 4 (b4) -->
    <text x="50" y="193" fill="#38bdf8" font-size="12" font-weight="600">b₄ :</text>
    <text x="110" y="193" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="145" y="193" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="180" y="193" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">−1</text>
    <text x="215" y="193" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">+1</text>
    <text x="260" y="193" fill="#cbd5e1" font-size="11">(x₃ → x₄)</text>

    <!-- row 5 (b5) -->
    <text x="50" y="223" fill="#38bdf8" font-size="12" font-weight="600">b₅ :</text>
    <text x="110" y="223" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">+1</text>
    <text x="145" y="223" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="180" y="223" text-anchor="middle" fill="#64748b" font-size="13">0</text>
    <text x="215" y="223" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">−1</text>
    <text x="260" y="223" fill="#cbd5e1" font-size="11">(x₄ → x₁)</text>

    <!-- Subspaces & Euler's Formula Card -->
    <rect x="0" y="275" width="360" height="215" rx="14" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2" />
    
    <text x="20" y="305" fill="#34d399" font-size="15" font-weight="700">Subspaces &amp; Kirchhoff's Laws</text>
    
    <text x="20" y="333" fill="#e2e8f0" font-size="13">• <tspan font-weight="700" fill="#38bdf8">N(A)</tspan>: dim = n − r = 4 − 3 = <tspan font-weight="700" fill="#f8fafc">1</tspan> (Node Potentials)</text>
    <text x="32" y="351" fill="#94a3b8" font-size="11">x = c [1, 1, 1, 1]ᵀ (constant potential)</text>

    <text x="20" y="377" fill="#e2e8f0" font-size="13">• <tspan font-weight="700" fill="#fbbf24">N(Aᵀ)</tspan>: dim = m − r = 5 − 3 = <tspan font-weight="700" fill="#f8fafc">2</tspan> (Current Loops)</text>
    <text x="32" y="395" fill="#94a3b8" font-size="11">Aᵀ y = 0 represents Kirchhoff's Current Law (KCL)</text>

    <!-- Euler Formula Highlight Box -->
    <rect x="20" y="415" width="320" height="58" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="180" y="437" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="700">Euler's Formula: Nodes − Edges + Loops = 1</text>
    <text x="180" y="458" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">4 − 5 + 2 = 1 ✓</text>
  </g>
</svg>
